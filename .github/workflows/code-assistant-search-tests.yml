name: code-assistant-search-tests

on:
  pull_request:
    branches: [work]
    paths:
      - 'MCP/KIS Code Assistant MCP/**'
      - '.github/workflows/code-assistant-search-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install search dependencies
        run: python -m pip install pandas==2.3.1
      - name: Run isolated Code Assistant search tests
        run: python -m unittest discover -s "MCP/KIS Code Assistant MCP/tests" -p test_api_searcher.py -v
